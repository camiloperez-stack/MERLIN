<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERLÍN SEGUROS — CRM Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                            950: '#2e1065',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-purple-500 selection:text-white">

    <!-- Navbar Principal -->
    <header class="bg-slate-900 border-b border-purple-900/40 px-6 py-3.5 flex justify-between items-center shadow-lg relative z-20">
        <div class="flex items-center space-x-3">
            <!-- Olive Branch Logo SVG (Estilo sutil morado / dorado) -->
            <div class="w-10 h-10 rounded-xl bg-purple-950 border border-purple-800/50 flex items-center justify-center shadow-inner text-amber-400">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 21c-4-4-7-9-7-14a7 7 0 0 1 14 0c0 5-3 10-7 14z" opacity="0.15" fill="currentColor"/>
                    <path d="M12 21C12 12 7 6 3 4"/>
                    <path d="M7 11c-2-1-3-3-3-5 2 0 4 1 5 3"/>
                    <path d="M10 16c-2.5-1-4-3.5-4-6 2.5 0 5 1.5 6 4"/>
                    <path d="M12 21c0-9 5-15 9-17"/>
                    <path d="M17 11c2-1 3-3 3-5-2 0-4 1-5 3"/>
                    <path d="M14 16c2.5-1 4-3.5 4-6-2.5 0-5 1.5-6 4"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-white flex items-center gap-2">
                    MERLÍN <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-purple-900/60 border border-purple-700/50 text-purple-300">SEGUROS</span>
                </h1>
                <p class="text-xs text-slate-400">Gestión Operativa & CRM de Pólizas</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button id="btn-reset-filter" onclick="clearFilter()" class="hidden text-xs bg-slate-800 hover:bg-slate-700 text-purple-300 px-3 py-2 rounded-lg border border-purple-800/40 transition items-center gap-1.5">
                <i class="fa-solid fa-filter-circle-xmark"></i> Mostrar Todos
            </button>
            <button onclick="openModal()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium text-xs md:text-sm px-4 py-2 rounded-xl transition shadow-lg shadow-purple-900/30 flex items-center gap-2 border border-purple-400/20">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Nuevo Ticket</span>
            </button>
        </div>
    </header>

    <!-- App Body: Sidebar + Pipeline -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar Izquierda: Estados e Sub-estados -->
        <aside class="w-72 bg-slate-900/90 border-r border-purple-900/30 flex flex-col shrink-0 custom-scrollbar overflow-y-auto">
            <div class="p-4 border-b border-purple-900/20 flex justify-between items-center">
                <h2 class="text-xs font-bold uppercase tracking-wider text-purple-400 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-purple-500"></i> Flujo por Módulos
                </h2>
                <span id="active-filter-badge" class="text-[10px] bg-purple-900/80 text-purple-200 px-2 py-0.5 rounded-full font-medium">Todos</span>
            </div>

            <nav class="p-3 space-y-4 text-xs">
                <!-- Filtro General -->
                <div>
                    <button onclick="filterBySubstate('all', 'Todos los Estados')" class="substate-btn w-full text-left px-3 py-2 rounded-lg hover:bg-purple-900/30 text-slate-300 font-medium flex justify-between items-center transition bg-purple-950/40 border border-purple-800/30">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-layer-group text-purple-400"></i> Todos los Tickets
                        </span>
                        <span id="count-all" class="bg-purple-900 text-purple-200 text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
                    </button>
                </div>

                <!-- 1. Módulo de Contacto -->
                <div class="space-y-1">
                    <div class="px-2 py-1 text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center justify-between">
                        <span class="text-purple-400"><i class="fa-solid fa-address-book mr-1.5"></i>1. Contacto</span>
                    </div>
                    <div class="pl-2 space-y-0.5 border-l-2 border-purple-900/50">
                        <button onclick="filterBySubstate('Potenciales', 'Potenciales')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Potenciales</span>
                            <span id="count-Potenciales" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Habituales', 'Habituales')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Habituales</span>
                            <span id="count-Habituales" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Reanudados', 'Reanudados')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Reanudados</span>
                            <span id="count-Reanudados" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Inactivos', 'Inactivos')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Inactivos</span>
                            <span id="count-Inactivos" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Ilocalizables', 'Ilocalizables')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Ilocalizables</span>
                            <span id="count-Ilocalizables" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                    </div>
                </div>

                <!-- 2. Módulo Técnico -->
                <div class="space-y-1">
                    <div class="px-2 py-1 text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center justify-between">
                        <span class="text-amber-400"><i class="fa-solid fa-gears mr-1.5"></i>2. Técnico</span>
                    </div>
                    <div class="pl-2 space-y-0.5 border-l-2 border-amber-900/40">
                        <button onclick="filterBySubstate('Solicitud de elaboración', 'Solicitud elaboración')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Solicitud elaboración</span>
                            <span id="count-Solicitud de elaboración" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Propuesta elaborada', 'Propuesta elaborada')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Propuesta elaborada</span>
                            <span id="count-Propuesta elaborada" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Propuesta enviada', 'Propuesta enviada')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Propuesta enviada</span>
                            <span id="count-Propuesta enviada" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Inspección', 'Inspección')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Inspección</span>
                            <span id="count-Inspección" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Re-inspección', 'Re-inspección')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Re-inspección</span>
                            <span id="count-Re-inspección" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Emisión Solicitada', 'Emisión Solicitada')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Emisión Solicitada</span>
                            <span id="count-Emisión Solicitada" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Póliza elaborada', 'Póliza elaborada')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Póliza elaborada</span>
                            <span id="count-Póliza elaborada" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Autorización especial', 'Autorización especial')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Autorización especial</span>
                            <span id="count-Autorización especial" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                    </div>
                </div>

                <!-- 3. Módulo Comercial -->
                <div class="space-y-1">
                    <div class="px-2 py-1 text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center justify-between">
                        <span class="text-violet-400"><i class="fa-solid fa-handshake mr-1.5"></i>3. Comercial</span>
                    </div>
                    <div class="pl-2 space-y-0.5 border-l-2 border-violet-900/40">
                        <button onclick="filterBySubstate('Negociación en curso', 'Negociación en curso')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900/20 text-slate-400 hover:text-slate-200 flex justify-between items-center transition">
                            <span>• Negociación en curso</span>
                            <span id="count-Negociación en curso" class="text-[10px] text-slate-500 font-medium">0</span>
                        </button>
                        <button onclick="filterBySubstate('Documentación pendiente', 'Doc. pendiente')" class="substate-btn w-full text-left px-2.5 py-1.5 rounded-md hover:bg-purple-900
