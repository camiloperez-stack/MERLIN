<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - Merlín Seguros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- Navbar -->
    <header class="bg-indigo-900 text-white p-4 shadow-lg flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-400 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">MERLÍN SEGUROS — CRM Pipeline</h1>
        </div>
        <button onclick="toggleModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-2 rounded-lg transition shadow">
            + Nuevo Cliente
        </button>
    </header>

    <!-- Main Content / Pipeline -->
    <main class="p-6 overflow-x-auto">
        <div id="pipeline-container" class="flex gap-4 min-w-[1500px]">
            <!-- Las columnas se generan con JavaScript -->
        </div>
    </main>

    <!-- Modal Formulario -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-lg font-bold text-indigo-900">Registrar Cliente / Solicitud</h2>
                <button onclick="toggleModal()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
            </div>
            <form id="client-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500">Ramo</label>
                        <select id="ramo" class="w-full border p-2 rounded text-sm bg-slate-50">
                            <option value="Autos">Autos</option>
                            <option value="Vida">Vida</option>
                            <option value="Hogar">Hogar</option>
                            <option value="Salud">Salud</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500">Fuente / Origen</label>
                        <select id="origen" class="w-full border p-2 rounded text-sm bg-slate-50">
                            <option value="Meta">Meta</option>
                            <option value="TikTok">TikTok</option>
                            <option value="Google">Google</option>
                            <option value="Referido">Referidos</option>
                        </select>
                    </div>
                </div>

                <div class="border-t pt-2">
                    <h3 class="text-xs font-bold uppercase text-indigo-900 mb-2">Datos de la Persona</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <input id="nombre" type="text" placeholder="Nombre completo" class="border p-2 rounded text-sm w-full" required>
                        <input id="cedula" type="text" placeholder="CC / NIT" class="border p-2 rounded text-sm w-full" required>
                        <input id="telefono" type="tel" placeholder="Teléfono" class="border p-2 rounded text-sm w-full">
                        <input id="ciudad" type="text" placeholder="Ciudad" class="border p-2 rounded text-sm w-full">
                    </div>
                </div>

                <div class="border-t pt-2">
                    <h3 class="text-xs font-bold uppercase text-indigo-900 mb-2">Datos del Vehículo / Objeto</h3>
                    <div class="grid grid-cols-3 gap-4">
                        <input id="placa" type="text" placeholder="Placa" class="border p-2 rounded text-sm w-full uppercase">
                        <input id="marca" type="text" placeholder="Marca y Línea" class="border p-2 rounded text-sm w-full">
                        <input id="modelo" type="text" placeholder="Modelo" class="border p-2 rounded text-sm w-full">
                    </div>
                </div>

                <div class="border-t pt-2">
                    <h3 class="text-xs font-bold uppercase text-indigo-900 mb-2">Compañía & Financiero</h3>
                    <div class="grid grid-cols-3 gap-4">
                        <input id="aseguradora" type="text" placeholder="Aseguradora" class="border p-2 rounded text-sm w-full">
                        <input id="primaBruta" type="number" placeholder="Prima Bruta ($)" class="border p-2 rounded text-sm w-full">
                        <input id="primaNeta" type="number" placeholder="Prima Neta ($)" class="border p-2 rounded text-sm w-full">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t">
                    <button type="button" onclick="toggleModal()" class="px-4 py-2 border rounded text-slate-600 text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-900 text-white rounded text-sm hover:bg-indigo-800">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Principal -->
    <script>
        const stages = [
            { id: 'contacto', title: '1. Contacto', color: 'border-blue-500' },
            { id: 'tecnico', title: '2. Técnico', color: 'border-yellow-500' },
            { id: 'comercial', title: '3. Comercial', color: 'border-orange-500' },
            { id: 'financiero', title: '4. Financiero', color: 'border-emerald-500' },
            { id: 'radicacion', title: '5. Radicación', color: 'border-purple-500' }
        ];

        let clients = JSON.parse(localStorage.getItem('merlin_clients')) || [
            {
                id: 1,
                nombre: 'Carlos Pérez',
                cedula: '1018239120',
                telefono: '3001234567',
                ramo: 'Autos',
                origen: 'Meta',
                placa: 'KLR-456',
                marca: 'Mazda 3',
                aseguradora: 'Sura',
                primaBruta: 2500000,
                stage: 'contacto',
                substate: 'Potencial'
            }
        ];

        function renderPipeline() {
            const container = document.getElementById('pipeline-container');
            container.innerHTML = '';

            stages.forEach(stage => {
                const column = document.createElement('div');
                column.className = `w-72 bg-slate-200/60 rounded-lg p-3 flex flex-col gap-3 border-t-4 ${stage.color} min-h-[70vh]`;
                
                const stageClients = clients.filter(c => c.stage === stage.id);

                column.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <h2 class="font-bold text-sm text-slate-700 uppercase">${stage.title}</h2>
                        <span class="bg-slate-300 text-slate-700 text-xs px-2 py-0.5 rounded-full font-bold">${stageClients.length}</span>
                    </div>
                    <div class="flex-1 space-y-3 overflow-y-auto" ondragover="allowDrop(event)" ondrop="drop(event, '${stage.id}')">
                        ${stageClients.map(c => createCard(c)).join('')}
                    </div>
                `;
                container.appendChild(column);
            });
        }

        function createCard(c) {
            return `
                <div id="card-${c.id}" draggable="true" ondragstart="drag(event, ${c.id})" class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 hover:shadow-md transition cursor-grab active:cursor-grabbing">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-bold px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full">${c.ramo}</span>
                        <span class="text-[10px] text-slate-400 font-medium">${c.origen}</span>
                    </div>
                    <h3 class="font-bold text-sm text-slate-800">${c.nombre}</h3>
                    <p class="text-xs text-slate-500">CC: ${c.cedula}</p>
                    ${c.placa ? `<p class="text-xs font-semibold text-slate-700 mt-1"><i class="fa-solid fa-car text-slate-400 mr-1"></i>${c.placa} (${c.marca})</p>` : ''}
                    <div class="mt-3 pt-2 border-t flex justify-between items-center text-xs">
                        <span class="text-emerald-600 font-bold">$${Number(c.primaBruta || 0).toLocaleString()}</span>
                        <select onchange="changeStage(${c.id}, this.value)" class="text-[11px] bg-slate-100 border rounded px-1 py-0.5">
                            ${stages.map(s => `<option value="${s.id}" ${c.stage === s.id ? 'selected' : ''}>${s.title}</option>`).join('')}
                        </select>
                    </div>
                </div>
            `;
        }

        function toggleModal() {
            document.getElementById('modal').classList.toggle('hidden');
        }

        document.getElementById('client-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const newClient = {
                id: Date.now(),
                nombre: document.getElementById('nombre').value,
                cedula: document.getElementById('cedula').value,
                telefono: document.getElementById('telefono').value,
                ciudad: document.getElementById('ciudad').value,
                ramo: document.getElementById('ramo').value,
                origen: document.getElementById('origen').value,
                placa: document.getElementById('placa').value,
                marca: document.getElementById('marca').value,
                modelo: document.getElementById('modelo').value,
                aseguradora: document.getElementById('aseguradora').value,
                primaBruta: document.getElementById('primaBruta').value,
                primaNeta: document.getElementById('primaNeta').value,
                stage: 'contacto'
            };
            clients.push(newClient);
            saveAndRender();
            toggleModal();
            this.reset();
        });

        function changeStage(id, newStage) {
            clients = clients.map(c => c.id === id ? { ...c, stage: newStage } : c);
            saveAndRender();
        }

        // Drag & Drop
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev, id) { ev.dataTransfer.setData("text", id); }
        function drop(ev, stageId) {
            ev.preventDefault();
            const id = ev.dataTransfer.getData("text");
            changeStage(Number(id), stageId);
        }

        function saveAndRender() {
            localStorage.setItem('merlin_clients', JSON.stringify(clients));
            renderPipeline();
        }

        renderPipeline();
    </script>
</body>
</html>
